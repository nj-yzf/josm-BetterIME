<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Keyboard base -->
  <rect x="1" y="5" width="22" height="14" rx="2" ry="2" fill="none" stroke="#333" stroke-width="1.5"/>
  <!-- Keyboard keys row 1 -->
  <rect x="3" y="7" width="3" height="2.5" rx="0.5" fill="#666"/>
  <rect x="7" y="7" width="3" height="2.5" rx="0.5" fill="#666"/>
  <rect x="11" y="7" width="3" height="2.5" rx="0.5" fill="#666"/>
  <rect x="15" y="7" width="3" height="2.5" rx="0.5" fill="#666"/>
  <rect x="19" y="7" width="2" height="2.5" rx="0.5" fill="#666"/>
  <!-- Keyboard keys row 2 -->
  <rect x="3" y="11" width="3" height="2.5" rx="0.5" fill="#666"/>
  <rect x="7" y="11" width="3" height="2.5" rx="0.5" fill="#666"/>
  <rect x="11" y="11" width="3" height="2.5" rx="0.5" fill="#666"/>
  <rect x="15" y="11" width="3" height="2.5" rx="0.5" fill="#666"/>
  <rect x="19" y="11" width="2" height="2.5" rx="0.5" fill="#666"/>
  <!-- Spacebar -->
  <rect x="6" y="15" width="12" height="2" rx="0.5" fill="#666"/>
  <!-- Chinese character "中" indicator -->
  <text x="21" y="4" font-family="sans-serif" font-size="6" fill="#e74c3c" font-weight="bold" text-anchor="middle">中</text>
</svg>
